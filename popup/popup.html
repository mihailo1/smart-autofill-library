<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Smart Autofill Library</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="af-app">
    <header class="af-header">
      <h1>Smart Autofill</h1>
      <button id="af-open-options" class="af-icon-btn" title="Настройки">⚙️</button>
    </header>

    <div id="af-resume-menu" class="af-resume-menu hidden">
      <div class="af-preview-header">
        <span id="af-resume-menu-title">Выберите резюме</span>
        <button id="af-resume-menu-close" class="af-icon-btn">✕</button>
      </div>
      <div id="af-resume-menu-list" class="af-resume-menu-list"></div>
    </div>

    <div class="af-actions">
      <button id="af-autofill-btn" class="af-btn af-btn-primary">⚡ Автозаполнить</button>
      <button id="af-scan-save-btn" class="af-btn af-btn-secondary">💾 Сохранить в библиотеку</button>
    </div>

    <label class="af-toggle-row" title="На страницах с формами появится подсказка">
      <span class="af-toggle-text">
        <span class="af-toggle-title">Автопоиск полей</span>
        <span class="af-toggle-sub">Хинт на страницах, где есть поля</span>
      </span>
      <input type="checkbox" id="af-auto-search" class="af-toggle-input" />
      <span class="af-toggle-track" aria-hidden="true"></span>
    </label>

    <div class="af-shortcut-hint" id="af-shortcut-hint">
      <div class="af-shortcut-line">
        Заполнить: <kbd id="af-shortcut-label">Alt+Shift+A</kbd>
      </div>
      <div class="af-shortcut-line">
        Сохранить: <kbd id="af-save-shortcut-label">Alt+Shift+S</kbd>
      </div>
      <a href="#" id="af-shortcut-link" class="af-shortcut-link">настроить</a>
    </div>

    <div id="af-status" class="af-status"></div>

    <div id="af-essay-panel" class="af-essay-panel hidden">
      <div class="af-preview-header">
        <span>Вопросы вакансии — сгенерируйте ответы с помощью ✨</span>
        <button id="af-essay-close" class="af-icon-btn">✕</button>
      </div>
      <div id="af-essay-list" class="af-essay-list"></div>
      <div class="af-preview-footer">
        <button id="af-essay-cancel" class="af-btn af-btn-secondary">Отмена</button>
        <button id="af-essay-apply" class="af-btn af-btn-primary">Вставить на страницу</button>
      </div>
    </div>

    <div id="af-preview" class="af-preview hidden">
      <div class="af-preview-header">
        <span>Найденные поля — отметьте, что сохранить</span>
        <button id="af-preview-close" class="af-icon-btn">✕</button>
      </div>
      <div id="af-preview-list" class="af-preview-list"></div>
      <div class="af-preview-footer">
        <button id="af-preview-cancel" class="af-btn af-btn-secondary">Отмена</button>
        <button id="af-preview-confirm" class="af-btn af-btn-primary">Сохранить выбранное</button>
      </div>
    </div>

    <div class="af-footer">
      <span id="af-library-count"></span>
    </div>
  </div>

  <script src="../lib/conceptVocabulary.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/matcher.js"></script>
  <script src="../lib/geminiClient.js"></script>
  <script src="popup.js"></script>
</body>
</html>

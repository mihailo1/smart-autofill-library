name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check extension scripts
        run: |
          set -e
          find . -name '*.js' \
            ! -path './.git/*' \
            ! -path './lib/vendor/*' \
            ! -path './node_modules/*' \
            -print0 | while IFS= read -r -d '' f; do
              echo "check $f"
              node --check "$f"
            done

      - name: Unit tests (matcher / vocabulary / field helpers)
        run: node test/run.js
